# 计划 006 4.3：Compose 一键启动（仅两个长期服务 + 一个 SQLite 命名卷）。
# 真实密码与会话密钥由未跟踪的 compose.local.env 注入（示例见 compose.local.env.example）；
# 启动不会删除卷，数据随卷持久保留，显式清理用 docker compose down -v。
name: ar-inspection

services:
  backend:
    build: ./backend
    image: ar-inspection-backend:006
    env_file:
      - path: compose.local.env
        required: true
    environment:
      ADDR: ":8080"
      ISSUE_DB_PATH: /data/inspection.db
    ports:
      - "8080:8080" # 真机 Unity 直连 http://<电脑局域网IP>:8080，与本机跑 Go 一致
    volumes:
      - inspection-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build: ./web
    image: ar-inspection-web:006
    ports:
      - "5173:80" # 管理端：浏览器访问 http://localhost:5173，/api 同源代理到 backend
    depends_on:
      backend:
        condition: service_healthy

volumes:
  inspection-data:
