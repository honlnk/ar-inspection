# 计划 006 4.3：管理端 Nginx 站点配置。
# 前端以空 API 基址构建，所有请求同源发往本机 80，再由这里代理到后端容器。
# 本文件位于 http 上下文（conf.d），map 只能放在 server 之外。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 同源 /api 反向代理（含 /api/ws 的 WebSocket 升级）；
    # proxy_pass 不带 URI，原样转发 /api 前缀，与后端路由一致
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 实时连接空闲期较长，放宽读写超时（客户端本身有断线重连兜底）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA 静态资源：哈希资源直达，其余路径回退 index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
