plugins {
    id 'com.android.application'
}

android {
    namespace 'com.holocode.archeck'
    compileSdk 35

    defaultConfig {
        applicationId "com.holocode.archeck"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.ar:core:1.57.0'
}
